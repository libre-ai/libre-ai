name: canonical-bootstrap

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: libre-ai-eu
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Verify pinned toolchains
        run: |
          test "$(bun --revision)" = "1.4.0-canary.1+57f349f63"
          test "$(rustc --version | awk '{print $2}')" = "1.97.0"
      - name: Install Bun dependencies
        run: bun install --frozen-lockfile
      - name: Bun and TypeScript gates
        run: bun run check
      - name: Rust gates
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo deny check
