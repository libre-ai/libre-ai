name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual escape hatch: GitHub occasionally fails to deliver pull_request
  # open/synchronize events, leaving required checks unreported and a PR
  # BLOCKED. `gh workflow run ci.yml --ref <branch>` (or the Actions UI)
  # re-runs the same gates on demand; the checks attach to the branch head SHA
  # and satisfy branch protection like an event-triggered run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licensing:
    uses: libre-ai/governance/.github/workflows/reusable-licensing.yml@c64ea95db35e49d5d2a5e69e3a52342661150ff7
    with:
      tooling_ref: c64ea95db35e49d5d2a5e69e3a52342661150ff7

  bun-quality:
    name: Bun quality
    runs-on: ubuntu-latest
    steps:
      # Full history: `check:forgotten` proves each evicted tree is still recoverable
      # at the commit its register entry records. Unverifiable in a shallow clone.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install archived Bun toolchain
        env:
          BUN_ARCHIVE_URL: https://github.com/libre-ai/libre-ai/releases/download/toolchain-bun-1.4.0-canary.1-57f349f63/bun-linux-x64.zip
          BUN_ARCHIVE_SHA256: 83144e2542c33aaae541cf16b42f8cf1c55c3b94c5395fc776417fa27e95bcbf
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bun.zip" "$BUN_ARCHIVE_URL"
          echo "$BUN_ARCHIVE_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Verify Bun 1.4+ floor and exact CI revision
        run: |
          test "$(bun --revision)" = "1.4.0-canary.1+57f349f63"
          bun run check:toolchain
      - run: bun install --frozen-lockfile
      - run: bun run check
      # WP-G2-Q01 foundation gates (acceptance 2 secret, acceptance 3 no-Clever).
      # Wired here, in the Q01 writePath, rather than in the root package.json.
      - run: bun tools/quality/check-secret-scan.ts
      - run: bun tools/quality/check-no-clever-production.ts
      # Front-C local-only guarantee (WP-G3-B01 boussole, WP-G3-P01 practices):
      # user data never leaves the device — no outbound transmission primitive in
      # those apps' source.
      - run: bun tools/quality/check-no-transmission.ts
      # Personal-data boundary (ADR-0012, I-21/I-22): this repository publishes
      # code, never instance data. Curated organisation records belong to a
      # private tenant, anything about a natural person stays on-device.
      - run: bun tools/quality/check-personal-data-boundary.ts
      # Reachability: a source no entry point can reach, an export nothing ever
      # names, a dependency nothing imports. Reports how many entries it
      # examined and fails on zero, so a moved directory turns this red instead
      # of passing on an empty set.
      - run: bun tools/quality/check-dead-code.ts
      - run: bun audit

