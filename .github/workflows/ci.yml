name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Licensing and contribution governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Verify DCO sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r commit; do
            expected="Signed-off-by: $(git show --no-patch --format='%an <%ae>' "$commit")"
            if ! git show --no-patch --format=%B "$commit" | git interpret-trailers --parse | grep -Fqx "$expected"; then
              echo "::error::Missing author-matching Signed-off-by trailer on $commit"
              missing=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          exit "$missing"
      - name: Verify DCO sign-offs on pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          # Anticipatory WP-G2-Q01 change: the pull_request step above cannot
          # see the GitHub-generated merge commit because it does not exist
          # yet at review time. This step closes that gap on push without
          # re-examining accepted history: only the commits introduced by
          # this push are verified. A GitHub-generated merge commit cannot
          # carry an author-matching trailer (its author is the forge
          # account), so it must carry the merging maintainer's
          # Signed-off-by trailer in the merge message instead.
          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "::warning::Push base $BEFORE_SHA is not reachable; skipping range verification"
            exit 0
          fi
          missing=0
          while read -r commit; do
            committer="$(git show --no-patch --format='%cn <%ce>' "$commit")"
            parent_words="$(git rev-list --parents -n 1 "$commit" | wc -w)"
            trailers="$(git show --no-patch --format=%B "$commit" | git interpret-trailers --parse)"
            if [ "$committer" = "GitHub <noreply@github.com>" ] && [ "$parent_words" -gt 2 ]; then
              if ! printf '%s\n' "$trailers" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
                echo "::error::GitHub-generated merge commit $commit lacks a Signed-off-by trailer in its merge message"
                missing=1
              fi
            else
              expected="Signed-off-by: $(git show --no-patch --format='%an <%ae>' "$commit")"
              if ! printf '%s\n' "$trailers" | grep -Fqx "$expected"; then
                echo "::error::Missing author-matching Signed-off-by trailer on $commit"
                missing=1
              fi
            fi
          done < <(git rev-list "$BEFORE_SHA..$AFTER_SHA")
          exit "$missing"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install pinned REUSE toolchain
        run: python -m pip install --disable-pip-version-check --requirement tools/licensing/requirements.txt
      - name: Verify REUSE compliance
        run: reuse lint

  bun-quality:
    name: Bun quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install archived Bun toolchain
        env:
          BUN_ARCHIVE_URL: https://github.com/libre-ai/libre-ai/releases/download/toolchain-bun-1.4.0-canary.1-57f349f63/bun-linux-x64.zip
          BUN_ARCHIVE_SHA256: 83144e2542c33aaae541cf16b42f8cf1c55c3b94c5395fc776417fa27e95bcbf
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bun.zip" "$BUN_ARCHIVE_URL"
          echo "$BUN_ARCHIVE_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Verify Bun 1.4+ floor and exact CI revision
        run: |
          test "$(bun --revision)" = "1.4.0-canary.1+57f349f63"
          bun run check:toolchain
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun audit

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable action
        with:
          toolchain: "1.97.0"
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Build capability-free Notebook Core WASM
        run: cargo build --locked -p libre-ai-notebook-core --release --target wasm32-unknown-unknown
      - name: Verify Notebook Core WASM imports and memory cap
        run: >-
          cargo run --locked -p libre-ai-notebook-core --example check_wasm_imports --
          target/wasm32-unknown-unknown/release/libre_ai_notebook_core.wasm
      - name: Verify reproducible Notebook Core WASM
        run: |
          artifact=target/wasm32-unknown-unknown/release/libre_ai_notebook_core.wasm
          CARGO_TARGET_DIR="$RUNNER_TEMP/notebook-core-rebuild" \
            cargo build --locked -p libre-ai-notebook-core --release --target wasm32-unknown-unknown
          rebuilt="$RUNNER_TEMP/notebook-core-rebuild/wasm32-unknown-unknown/release/libre_ai_notebook_core.wasm"
          cmp "$artifact" "$rebuilt"
          sha256sum "$artifact" "$rebuilt"
      - uses: taiki-e/install-action@e28ac56891501ddb0600608470dbe94544964ed4 # v2
        with:
          tool: cargo-deny@0.19.5
      - run: cargo deny check advisories licenses sources
