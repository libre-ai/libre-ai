[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["toolchains/vendor/biscuit-auth"]

[workspace.dependencies]
biscuit-auth = { version = "=6.0.0", path = "toolchains/vendor/biscuit-auth", default-features = false }
biscuit-parser = "=0.2.0"
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"] }
jsonschema = { version = "=0.47.0", default-features = false }
regress = { version = "=0.11.1", default-features = false, features = ["backend-pikevm", "prohibit-unsafe", "std"] }
schemars = "=0.8.22"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = { version = "=0.11.0", default-features = false }
typify = { version = "=0.7.0", default-features = false }
wit-parser = { version = "=0.253.0", default-features = false, features = ["std"] }
zeroize = { version = "=1.9.0", features = ["alloc"] }

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libre-ai/libre-ai"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
