[package]
name = "libre-ai-agent-harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The contract is the single source of truth for field formats: contract-types
# generates newtypes whose regexes come straight from the JSON Schema. Validating
# through them removes the hand-written validators that diverged in both
# directions at review, and keeps one implementation of the domain (AGENTS.md).
libre-ai-contract-types = { path = "../contract-types" }
chrono.workspace = true
serde.workspace = true
serde_jcs.workspace = true
serde_json.workspace = true
sha2.workspace = true
