schema_version: libre-ai.repositories.v1
authority: single source of the public topology and exposure states (ADR-0009 §7)
updated_on: 2026-07-23
exposure_scale: [idea, spec-published, usable-verifiable, proven]
# `benchmark` records the best-in-class product each couche-1 product and the
# couche-2 application targets for parity (owner-established). It is a target, not
# a claim of parity reached; the deficit is tracked separately. Infrastructure and
# the own public projection carry no external benchmark.
repositories:
  - repository: libre-ai/libre-ai
    role: hub
    layer: moyeu
    visibility: public
    lifecycle: active
    exposure: usable-verifiable
    owns:
      - contracts, specifications, doctrine (invariants register)
      - shared foundations and high-churn bricks (layers 3-4 workshop)
      - fleet CI (cross-integration, compatibility matrices, fixtures)
    consumes: []
  - repository: libre-ai/.github
    role: org-profile
    layer: transverse
    visibility: public
    lifecycle: active
    exposure: usable-verifiable
    owns:
      - organization profile README (projection of this inventory)
    consumes:
      - this inventory
  - repository: libre-ai/feed-radar
    role: reserved-product-home
    layer: couche-1
    product: Radar
    visibility: public
    lifecycle: frozen-until-wave-4
    exposure: spec-published
    benchmark:
      product: Inoreader
      url: https://www.inoreader.com
    owns:
      - explainable feed selection and portable curation (at activation)
    consumes:
      - hub contracts, auth, data lifecycle, radar engine
    canonical_paths:
      - apps/radar
  - repository: libre-ai/notebook
    role: reserved-product-home
    layer: couche-1
    product: Notebook
    visibility: public
    lifecycle: frozen-until-wave-4
    exposure: spec-published
    benchmark:
      product: SiYuan
      url: https://github.com/siyuan-note/siyuan
    owns:
      - private local-first knowledge, controlled context export (at activation)
    consumes:
      - hub contracts, notebook-core (Gate B approved)
    canonical_paths:
      - apps/notebook
      - crates/notebook-core
  - repository: libre-ai/ai-practices
    role: reserved-product-home
    layer: couche-1
    product: AI Practices
    visibility: public
    lifecycle: frozen-until-wave-4
    exposure: spec-published
    benchmark:
      product: DataCamp
      url: https://www.datacamp.com
    owns:
      - professional training for sourced AI practice (at activation)
    consumes:
      - hub contracts, auth, data lifecycle
    canonical_paths:
      - apps/practices
  - repository: libre-ai/sessions
    role: reserved-product-home
    layer: couche-1
    product: Sessions
    visibility: public
    lifecycle: frozen-until-wave-4
    exposure: spec-published
    benchmark:
      product: Miro
      url: https://miro.com
    owns:
      - source-grounded collective learning and facilitation (at activation)
    consumes:
      - hub contracts, auth, data lifecycle
    canonical_paths:
      - apps/sessions
  - repository: libre-ai/boussole-politique
    role: reserved-product-home
    layer: couche-1
    product: Boussole Politique
    visibility: public
    lifecycle: frozen-until-wave-4
    exposure: spec-published
    benchmark:
      product: VAA (Voting Advice Application class)
      note: best-in-class VAA class — e.g. Wahl-O-Mat, iSideWith
    owns:
      - private civic comparison against sourced public votes (at activation)
    consumes:
      - hub contracts, boussole engine (contracts locked)
    canonical_paths:
      - apps/boussole
  - repository: libre-ai/spec-studio
    role: reserved-product-home
    layer: couche-1
    product: Spec Studio
    visibility: public
    lifecycle: frozen-until-wave-4
    exposure: spec-published
    benchmark:
      product: Notion
      url: https://www.notion.so
    owns:
      - product decisions, specifications and bounded handoffs (at activation)
    consumes:
      - hub contracts, auth
    canonical_paths:
      - apps/specifications
  - repository: libre-ai/policy
    role: reserved-product-home
    layer: couche-1
    product: Model Policy
    visibility: private
    target_visibility: public-after-secrets-audit (ADR-0009 §8, wave 4 entry)
    lifecycle: frozen-until-wave-4
    exposure: spec-published
    benchmark:
      product: Model registries
      note: model registry / model-card governance class — e.g. Hugging Face Hub
    owns:
      - model selection under explainable policy (at activation)
    consumes:
      - hub contracts, policy-core (contracts locked)
    canonical_paths:
      - apps/model-policy
      - crates/policy-core
  - repository: libre-ai/agent-board
    role: reserved-application-home
    layer: couche-2
    application: Missions
    # Missions est l'application de la couche 2, PAS un huitième produit :
    # le portefeuille compte sept produits (ADR-0009 §2). Ambiguïté détectée
    # par le test de l'agent froid du 2026-07-19 et corrigée le jour même.
    visibility: public
    lifecycle: frozen-until-wave-3
    exposure: spec-published
    benchmark:
      product: Multica
      url: https://github.com/multica-ai/multica
    owns:
      - human surface of agent missions (at activation, with the orchestrator lock)
    consumes:
      - hub contracts, orchestration contracts (locked, option B)
    canonical_paths:
      - apps/missions
  - repository: libre-ai/carriere
    role: reserved-product-home
    layer: couche-1
    product: Carrière
    # 8ᵉ produit couche-1, ajouté par décision propriétaire 2026-07-23 (topologie
    # multi-repo ADR-0008 ; loi de croissance ADR-0009 §4 « pas de plafond fixe »).
    # Le décompte « sept produits » de §2 décrivait l'état du 2026-07-19 ; la
    # constellation croît par décision propriétaire.
    visibility: public
    lifecycle: frozen-reserved
    exposure: idea
    benchmark: TBD (owner to set)
    owns:
      - sovereign, explainable job-search assistant for cadres (at activation)
    consumes:
      - hub contracts, auth, data lifecycle
    canonical_paths:
      - apps/carriere
  - repository: libre-ai/website
    role: reserved-projection-home
    layer: transverse
    product: Website
    # CDC verrouillé (docs/apps/website.md, check-specification-lock) ; repo
    # réservé créé le 2026-07-23 pour réconcilier l'inventaire observable.
    visibility: public
    lifecycle: frozen-reserved
    exposure: spec-published
    benchmark: n/a (own public projection, not a parity target)
    owns:
      - public citable projection of reviewed knowledge, product records, evidence (at activation)
    consumes:
      - hub corpus, product projections, forge evidence
    canonical_paths:
      - docs/apps/website.md
notes:
  - Layer 3-4 bricks live in the hub until the coverage law promotes them
    (ADR-0009 §4); they enter this inventory when they gain a public surface.
  - No private personal repository belongs to this inventory (ADR-0009 §9).
  - Layer 2 (agent orchestration, productized) is named Polaris (ADR-0011 D2);
    its bricks (orchestrator, harness) enter this inventory at wave 3.
  - First engine is Notebook (pilot); the rest follow in parallel orchestrated
    by Polaris at wave 4b (ADR-0011 D1).
  - benchmark targets are owner-established best-in-class references for parity;
    a target to reach, not a claim of parity already reached.
